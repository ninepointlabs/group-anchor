<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Group Anchor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <h1>Group Anchor</h1>
    </header>

    <label class="row">
      <span class="text">
        <span class="label">Enabled</span>
        <span class="hint">Keep groups below pinned tabs</span>
      </span>
      <input type="checkbox" id="enabled" role="switch" />
    </label>

    <label class="row" id="pause-row">
      <span class="text">
        <span class="label">Pause for this window</span>
        <span class="hint">Until the window closes</span>
      </span>
      <input type="checkbox" id="paused" role="switch" />
    </label>

    <script src="popup.js"></script>
  </body>
</html>
